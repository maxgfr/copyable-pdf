name: Check Program

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-script:
    # The install everyone is told to use is Homebrew on macOS, yet this only
    # ever ran on Ubuntu — so BSD sed, awk, xargs and mktemp were never exercised.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils imagemagick ghostscript shellcheck qpdf
          echo "CONVERT=convert" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install tesseract poppler imagemagick ghostscript shellcheck qpdf
          # ImageMagick 7 renamed the tool; `convert` is a deprecated shim there.
          echo "CONVERT=magick" >> "$GITHUB_ENV"

      # --paddle builds its Python environment with uv.
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Lint
        run: shellcheck -S warning script.sh

      - name: Find a font file the fixtures can be drawn with
        run: |
          # Not a font *name*: Homebrew's ImageMagick enumerates none at all
          # (`magick -list font` is empty), so only a path to a face on disk
          # works on both runners. A missing -font is a hard error, and the
          # fixture text has to be legible enough for OCR, so a symbol face
          # picked at random will not do.
          for f in \
            /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            /usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf \
            /System/Library/Fonts/Supplemental/Arial.ttf \
            /System/Library/Fonts/Supplemental/Verdana.ttf; do
            if [ -f "$f" ]; then
              echo "FIXTURE_FONT=$f" >> "$GITHUB_ENV"
              echo "using $f"
              exit 0
            fi
          done
          found=$(find /usr/share/fonts /System/Library/Fonts /Library/Fonts -type f \
                    \( -iname '*dejavusans*.ttf' -o -iname '*arial*.ttf' -o -iname '*liberationsans*.ttf' \) \
                    2>/dev/null | head -n 1)
          [ -n "$found" ] || { echo "❌ no usable sans font on this runner"; exit 1; }
          echo "FIXTURE_FONT=$found" >> "$GITHUB_ENV"
          echo "falling back to $found"

      - name: Create Dummy PDF
        run: |
          # Create a simple image with text
          $CONVERT -size 800x600 xc:white -font "$FIXTURE_FONT" -pointsize 24 -fill black -draw "text 20,50 'Hello World This is a test PDF for OCR'" page1.png
          $CONVERT -size 800x600 xc:white -font "$FIXTURE_FONT" -pointsize 24 -fill black -draw "text 20,50 'Second page with more text'" page2.png

          # Convert images to PDF
          $CONVERT page1.png page2.png input.pdf

          echo "Created input.pdf"

      - name: Run copyable-pdf
        run: |
          chmod +x script.sh
          ./script.sh -v input.pdf

      - name: Verify Output
        run: |
          if [ -f "input_ocr.pdf" ]; then
            echo "✅ Output file created successfully"
            ls -lh input_ocr.pdf
          else
            echo "❌ Output file missing"
            exit 1
          fi

      # This used to be `grep … && echo ✅ || echo ❌`, which reports a failure
      # and then exits 0 — the check could never fail. It is the only step that
      # proves OCR actually recognised anything, so it has to be able to.
      - name: Check OCR content
        run: |
          pdftotext input_ocr.pdf - | grep -q "Hello World"
          echo "✅ OCR text found"

      - name: Every page survives the merge
        run: |
          pages=$(pdfinfo input_ocr.pdf | awk '/^Pages/{print $2}')
          [ "$pages" = "2" ] || { echo "❌ expected 2 pages, got $pages"; exit 1; }
          echo "✅ 2 pages"

      # --- Regressions. Each of these shipped broken in 1.2.2. ---

      - name: Interactive mode reaches a conversion
        run: |
          # `local` outside a function aborted the run under `set -e`, so running
          # with no arguments never produced anything at all.
          printf 'input.pdf\n\n\nn\nn\n\n' | ./script.sh
          test -f input_ocr.pdf

      - name: Sidecars land beside the output, not beside its directory
        run: |
          # `${OUTPUT_FILE%.*}` strips at the last dot ANYWHERE in the path, so a
          # dotted directory sent the .md one level up, silently and with exit 0.
          mkdir -p "out/v1.2"
          ./script.sh -o "out/v1.2/report.pdf" -m -t input.pdf
          test -f "out/v1.2/report.md" || { echo "❌ .md missing from out/v1.2"; exit 1; }
          test -f "out/v1.2/report.txt" || { echo "❌ .txt missing from out/v1.2"; exit 1; }
          test ! -e "out/v1.md" || { echo "❌ .md escaped to out/v1.md"; exit 1; }
          echo "✅ sidecars stayed put"

      - name: A temp directory containing a space still merges
        run: |
          # The merge parsed `ls` output, so word-splitting turned each page path
          # into two non-existent ones. mktemp honours TMPDIR on Linux.
          mkdir -p "${{ runner.temp }}/with space"
          TMPDIR="${{ runner.temp }}/with space" ./script.sh -o spaced.pdf input.pdf
          pages=$(pdfinfo spaced.pdf | awk '/^Pages/{print $2}')
          [ "$pages" = "2" ] || { echo "❌ expected 2 pages, got $pages"; exit 1; }
          echo "✅ 2 pages with a spaced TMPDIR"

      - name: The POSIX locale is left alone
        run: |
          # The OCR language used to be stored in $LANG, which is the locale
          # variable and already exported — so "fra+eng" reached every child.
          grep -q 'OCR_LANG=' script.sh
          ! grep -qE '^\s*LANG="?\$(DEFAULT_LANG|2)' script.sh
          echo "✅ \$LANG is not hijacked"

      - name: A failed page aborts the run, it does not ship a short PDF
        run: |
          # The worker used to discard tesseract's exit code and print DONE
          # regardless, so a page whose OCR crashed simply vanished: the merge
          # carried on with the survivors and the run exited 0.
          mkdir -p shim
          real=$(command -v tesseract)
          cat > shim/tesseract <<SHIM
          #!/bin/bash
          for a in "\$@"; do case "\$a" in *page-2.png) echo "simulated OCR crash" >&2; exit 1;; esac; done
          exec $real "\$@"
          SHIM
          chmod +x shim/tesseract
          set +e
          PATH="$PWD/shim:$PATH" ./script.sh -o short.pdf input.pdf
          rc=$?
          set -e
          [ "$rc" -eq 1 ] || { echo "❌ expected exit 1, got $rc"; exit 1; }
          test ! -e short.pdf || { echo "❌ wrote a PDF with a page missing"; exit 1; }
          echo "✅ failed page aborted the run, nothing written"

      - name: An existing text layer is warned about, not silently replaced
        run: |
          # input_ocr.pdf already carries tesseract's invisible font layer, so
          # re-running on it is exactly the case that used to rasterise good
          # text away without a word.
          ./script.sh -o twice.pdf input_ocr.pdf 2> warn.log
          grep -q "text layer" warn.log || { echo "❌ no warning"; cat warn.log; exit 1; }
          echo "✅ warned before replacing an existing text layer"

      - name: Progress stays readable when stdout is not a terminal
        run: |
          # The bar redrew itself with \r on every page, so a piped run or a CI
          # log ended up as one unreadable line of bar frames.
          ./script.sh -o piped.pdf input.pdf > piped.log 2>&1
          ! grep -q $'\r' piped.log || { echo "❌ carriage returns in a piped log"; exit 1; }
          echo "✅ no bar frames off a terminal"

      - name: --preserve keeps the original pages instead of rasterising them
        run: |
          # The default path throws the original away: every page becomes a
          # 300 DPI PNG, so vectors, compression and metadata are lost. Preserve
          # mode stamps an invisible text layer onto the untouched original.
          ./script.sh -p -o kept.pdf input.pdf
          pdftotext kept.pdf - | grep -q "Hello World" || { echo "❌ no OCR text"; exit 1; }
          pages=$(pdfinfo kept.pdf | awk '/^Pages/{print $2}')
          [ "$pages" = "2" ] || { echo "❌ expected 2 pages, got $pages"; exit 1; }

          # The proof that the original survived: its images come through at
          # their own resolution, not re-rendered at the OCR DPI.
          w_in=$(pdfimages -list input.pdf | awk 'NR==3{print $4}')
          w_kept=$(pdfimages -list kept.pdf | awk 'NR==3{print $4}')
          w_raster=$(pdfimages -list input_ocr.pdf | awk 'NR==3{print $4}')
          [ "$w_kept" = "$w_in" ] || { echo "❌ preserve re-rendered the page ($w_kept vs $w_in)"; exit 1; }
          [ "$w_raster" != "$w_in" ] || { echo "❌ the raster path did not re-render, so this proves nothing"; exit 1; }
          echo "✅ preserve kept the original ${w_in}px pages; the raster path made them ${w_raster}px"

      # --- OCR quality. Each fixture is checked against --plain (the old
      # settings) too, so a test that would pass either way cannot hide here. ---

      - name: Build degraded page fixtures
        run: |
          # Four lines of text: orientation detection needs ~50 characters.
          $CONVERT -size 1700x2200 xc:white -font "$FIXTURE_FONT" -pointsize 40 -fill black \
            -draw "text 100,200 'The quick brown fox jumps over the lazy dog.'" \
            -draw "text 100,280 'Pack my box with five dozen liquor jugs today.'" \
            -draw "text 100,360 'Sphinx of black quartz, judge my solemn vow now.'" \
            -draw "text 100,440 'How vexingly quick daft zebras jump around here.'" upright.png
          # Upside down, as a page fed into the scanner the wrong way.
          $CONVERT upright.png -rotate 180 r180.png
          # A dark corner, as from a book spine or a phone photo.
          $CONVERT upright.png \( -size 1700x2200 radial-gradient:white-gray5 -roll +850+1100 \) \
            -compose Multiply -composite harsh.png
          # Crooked, blurred, noisy and washed out. Seeded, so every run is alike.
          $CONVERT upright.png -seed 1 -background white -rotate 6 -blur 0x1.5 \
            -attenuate 0.6 +noise Gaussian -level 0%,100%,0.7 noisy.png
          for f in r180 harsh noisy; do
            $CONVERT "$f.png" -units PixelsPerInch -density 200 "$f.pdf"
          done

      - name: An upside-down page is turned before OCR
        run: |
          # Without orientation detection tesseract reads the page as reversed
          # gibberish and exits 0, so nothing ever flagged it.
          ./script.sh -o r180_ocr.pdf r180.pdf
          pdftotext r180_ocr.pdf - | grep -q "black quartz" || { echo "❌ not rotated"; pdftotext r180_ocr.pdf -; exit 1; }
          ./script.sh -p -o r180_kept.pdf r180.pdf
          pdftotext r180_kept.pdf - | grep -q "black quartz" || { echo "❌ not rotated under --preserve"; exit 1; }
          ./script.sh --plain -o r180_plain.pdf r180.pdf
          ! pdftotext r180_plain.pdf - | grep -q "black quartz" || { echo "❌ --plain read it too, so this proves nothing"; exit 1; }
          echo "✅ upside-down page recognised, with and without --preserve"

      - name: A shadow does not swallow the text under it
        run: |
          # A single page-wide (Otsu) threshold turns the dark corner black,
          # text and all; Sauvola thresholds each region on its own.
          ./script.sh -o harsh_ocr.pdf harsh.pdf
          pdftotext harsh_ocr.pdf - | grep -qi "ebras" || { echo "❌ shadowed text lost"; pdftotext harsh_ocr.pdf -; exit 1; }
          ./script.sh --plain -o harsh_plain.pdf harsh.pdf
          ! pdftotext harsh_plain.pdf - | grep -qi "ebras" || { echo "❌ --plain read it too, so this proves nothing"; exit 1; }
          echo "✅ shadowed line recognised"

      - name: --clean recovers a crooked, noisy scan
        run: |
          ./script.sh -c -o noisy_clean.pdf noisy.pdf
          pdftotext noisy_clean.pdf - | grep -q "black quartz" || { echo "❌ --clean did not recover it"; pdftotext noisy_clean.pdf -; exit 1; }
          ./script.sh -o noisy_raw.pdf noisy.pdf
          ! pdftotext noisy_raw.pdf - | grep -q "black quartz" || { echo "❌ readable without --clean, so this proves nothing"; exit 1; }
          echo "✅ --clean recovered the noisy page"

      - name: --tessdata-dir works with a directory of bare models
        run: |
          # A tessdata_best checkout holds models only: no configs/pdf, no osd.
          # Asking for the `pdf` config there made tesseract write a .txt and
          # exit 0, and the run then failed with "0 page(s)" and no reason.
          sysdir=$(tesseract --list-langs 2>&1 | sed -n 's/.*"\(.*\)".*/\1/p' | head -n 1)
          mkdir -p models
          cp "$sysdir/eng.traineddata" models/
          ./script.sh --tessdata-dir models -o models.pdf input.pdf
          pdftotext models.pdf - | grep -q "Hello World" || { echo "❌ no OCR text"; exit 1; }
          echo "✅ bare model directory works"

      # --- PaddleOCR. Where only the plumbing is under test, the tiny model keeps
      # the runs short; the install is the same whatever the size. ---

      - name: --paddle reads what Tesseract cannot, and leaves nothing behind
        run: |
          # noisy.pdf without --clean: Tesseract returns nothing (checked above).
          # The default model: tiny reads it too, but with a typo or two.
          ./script.sh --paddle -o noisy_paddle.pdf noisy.pdf
          text=$(pdftotext noisy_paddle.pdf -)
          echo "$text" | grep -q "brown fox" && echo "$text" | grep -q "zebras" || { echo "❌ text missing"; echo "$text"; exit 1; }
          # Installed into the run's temp dir by default, so no trace may remain.
          test ! -e "$HOME/.cache/copyable-pdf" || { echo "❌ left an install in ~/.cache"; exit 1; }
          echo "✅ PaddleOCR read the noisy page and cleaned up after itself"

      - name: --save-paddle keeps the install, and later runs reuse it
        run: |
          ./script.sh --save-paddle --paddle-model tiny -o saved.pdf input.pdf
          test -x "$HOME/.cache/copyable-pdf/paddle/venv/bin/python" || { echo "❌ nothing saved"; exit 1; }
          ./script.sh --paddle --paddle-model tiny -p -o paddle_kept.pdf r180.pdf > reuse.log
          grep -q "Using PaddleOCR from" reuse.log || { echo "❌ reinstalled instead of reusing"; cat reuse.log; exit 1; }
          # --preserve: the original page survives and the text lands on it,
          # upside down as it is, in reading order.
          pdftotext paddle_kept.pdf - | head -n 1 | grep -q "quick brown fox" || { echo "❌ wrong text or order"; pdftotext paddle_kept.pdf -; exit 1; }
          w_in=$(pdfimages -list r180.pdf | awk 'NR==3{print $4}')
          w_kept=$(pdfimages -list paddle_kept.pdf | awk 'NR==3{print $4}')
          [ "$w_kept" = "$w_in" ] || { echo "❌ preserve re-rendered the page"; exit 1; }
          echo "✅ saved install reused; --preserve with PaddleOCR works"

      - name: More than 100 pages goes through the chunked merge
        run: |
          # pdfunite is called in slices of 100 above that count, to stay under
          # the open-file limit. Nothing ever exercised that branch.
          $CONVERT page1.png one.pdf
          args=()
          for i in $(seq 1 101); do args+=(one.pdf); done
          pdfunite "${args[@]}" big.pdf
          [ "$(pdfinfo big.pdf | awk '/^Pages/{print $2}')" = "101" ] || { echo "❌ fixture is not 101 pages"; exit 1; }
          ./script.sh -d 72 -o chunked.pdf big.pdf
          pages=$(pdfinfo chunked.pdf | awk '/^Pages/{print $2}')
          [ "$pages" = "101" ] || { echo "❌ expected 101 pages, got $pages"; exit 1; }
          echo "✅ 101 pages survived the chunked merge"

      - name: Bad input fails fast, before any OCR
        run: |
          mkdir -p outdir
          printf 'this is not a pdf\n' > notpdf.pdf
          cp input.pdf self.pdf
          set +e
          ./script.sh -l;                              [ $? -eq 2 ] || { echo "❌ missing -l value"; exit 1; }
          ./script.sh -d abc -o x.pdf input.pdf;       [ $? -eq 2 ] || { echo "❌ bad dpi"; exit 1; }
          ./script.sh -j 0 -o x.pdf input.pdf;         [ $? -eq 2 ] || { echo "❌ bad jobs"; exit 1; }
          ./script.sh -o nope/x.pdf input.pdf;         [ $? -eq 2 ] || { echo "❌ missing out dir"; exit 1; }
          ./script.sh -o outdir/ input.pdf;            [ $? -eq 2 ] || { echo "❌ output is a directory"; exit 1; }
          ./script.sh -o outdir input.pdf;             [ $? -eq 2 ] || { echo "❌ output is a directory"; exit 1; }
          ./script.sh -o self.pdf self.pdf;            [ $? -eq 2 ] || { echo "❌ output overwrites input"; exit 1; }
          ./script.sh -o x.pdf notpdf.pdf;             [ $? -eq 2 ] || { echo "❌ input is not a PDF"; exit 1; }
          ./script.sh -c -p -o x.pdf input.pdf;        [ $? -eq 2 ] || { echo "❌ --clean with --preserve"; exit 1; }
          ./script.sh --tessdata-dir nope -o x.pdf input.pdf; [ $? -eq 2 ] || { echo "❌ missing tessdata dir"; exit 1; }
          ./script.sh --paddle-model huge -o x.pdf input.pdf; [ $? -eq 2 ] || { echo "❌ bad paddle model"; exit 1; }
          ./script.sh --paddle -l kli -o x.pdf input.pdf;  [ $? -eq 2 ] || { echo "❌ language paddle lacks"; exit 1; }
          set -e
          test ! -e x.pdf
          # The source must still be the source, not a rasterised copy of itself.
          cmp -s self.pdf input.pdf || { echo "❌ the input was overwritten"; exit 1; }
          echo "✅ all rejected with exit 2, nothing written"

      - name: --version prints the version
        run: |
          declared=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' script.sh)
          [ -n "$declared" ] || { echo "❌ no VERSION= in script.sh"; exit 1; }
          for flag in -V --version; do
            out=$(./script.sh $flag)
            [ "$out" = "copyable-pdf $declared" ] || { echo "❌ $flag printed '$out'"; exit 1; }
          done
          echo "✅ version reported as $declared"
